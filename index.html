<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marlo</title>
  <meta name="description" content="Marlo — coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #0a0a0a;
      --muted: #6b6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 0.75rem 4rem;
      text-align: center;
      overflow: hidden;
    }
    /* Base unit for the pair. brand = 15em, coming = 1em → exact 15× */
    .stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Fit the 15em wordmark on screen: unit ≈ viewport / 15 / ~5.5 chars */
      font-size: clamp(7px, 1.35vw, 14px);
      gap: 0.45em; /* relative to base unit (= coming soon size) */
      line-height: 1;
      max-width: 100%;
    }
    .brand {
      font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15em; /* exactly 15 × .coming */
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 0.9;
      text-transform: lowercase;
      color: var(--ink);
      white-space: nowrap;
    }
    .coming {
      font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 1em; /* base */
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: lowercase;
      color: var(--ink);
      line-height: 1.2;
    }
    footer {
      position: fixed;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main>
    <div class="stack">
      <h1 class="brand">marlo</h1>
      <p class="coming">coming soon</p>
    </div>
  </main>
  <footer>© Marlo</footer>
</body>
</html>
