<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marlo</title>
  <meta name="description" content="Marlo — coming soon." />
  <!-- Inter is the closest widely available match to the geometric/humanist marlo wordmark -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #0a0a0a;
      --muted: #6b6b6b;
      /* Coming soon base; brand is exactly 15× this */
      --soon: clamp(0.55rem, 1.15vw, 0.78rem);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem 4rem;
      text-align: center;
    }
    .stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35em; /* relative to brand size so it stays tight under marlo */
    }
    .brand {
      font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: calc(var(--soon) * 15);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 0.95;
      text-transform: lowercase;
      color: var(--ink);
    }
    .coming {
      font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: var(--soon);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      color: var(--ink);
      line-height: 1.2;
    }
    footer {
      position: fixed;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main>
    <div class="stack">
      <h1 class="brand">marlo</h1>
      <p class="coming">Coming soon</p>
    </div>
  </main>
  <footer>© Marlo</footer>
</body>
</html>
