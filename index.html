<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marlo</title>
  <meta name="description" content="Marlo — coming soon." />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #0a0a0a;
      --muted: #6b6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 4rem;
      text-align: center;
      gap: 0.65rem;
    }
    .logo {
      width: min(820px, 92vw);
      height: auto;
      display: block;
    }
    .coming {
      font-size: clamp(1.15rem, 3.2vw, 1.55rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: lowercase;
      color: var(--ink);
      line-height: 1.2;
      margin-top: 0;
    }
    footer {
      position: fixed;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.svg" alt="marlo" width="820" height="205" />
    <p class="coming">Coming soon</p>
  </main>
  <footer>© Marlo</footer>
</body>
</html>
